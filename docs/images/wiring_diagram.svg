<svg viewBox="0 0 1650 1200" width="1650" height="1200" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, 'Liberation Mono', monospace"
  aria-label="Full wiring diagram: battery positive feeds the load-protection SSR to the load, battery negative feeds a low-side Kelvin shunt to the load, INA228 senses VBUS+ from battery positive and IN-/IN+ from the shunt sense screws, INA228 and OLED share an I2C bus with the XIAO ESP32-C3, two pushbuttons and a GPIO5 driver stage (resistor, NPN transistor, separate 5-12V supply) control the SSR, and everything shares one common ground">

<rect fill="#ffffff" stroke="#b9c0bd" stroke-width="2" x="2" y="2" width="1646" height="1196" rx="4"></rect>

<!-- ============ BAND 1: MAIN POWER PATH ============ -->

