<svg viewBox="0 0 1560 680" width="1560" height="680" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, 'Liberation Mono', monospace"
  aria-label="System architecture: the INA228 feeds Ina228Sensor into the TelemetryStore hub, which fans out over a telemetry bus to OledDisplay, BleTelemetryService, WebDashboard, MqttPublisher, LoadProtectionMonitor and Serial diagnostics; two physical buttons and the Web Dashboard drive dashed configuration paths; MqttPublisher reaches Home Assistant and LoadProtectionMonitor drives the Relay/SSR">

<rect fill="#ffffff" stroke="#b9c0bd" stroke-width="2" x="2" y="2" width="1556" height="676" rx="4"></rect>

<!-- buttons -->
<circle fill="#ffffff" stroke="#16222c" stroke-width="1.6" cx="110" cy="40" r="27"></circle>
<text fill="#16222c" font-size="17" font-weight="700" x="110" y="46" text-anchor="middle">D2</text>
<text fill="#57676f" font-size="14.5" x="110" y="88" text-anchor="middle">Display button</text>
<path fill="none" stroke="#8a969b" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" d="M137,40 H1065 V60"></path>
<text fill="#8a969b" font-size="13" x="600" y="32" text-anchor="middle">on/off, page</text>

<circle fill="#ffffff" stroke="#16222c" stroke-width="1.6" cx="110" cy="140" r="27"></circle>
<text fill="#16222c" font-size="17" font-weight="700" x="110" y="146" text-anchor="middle">D1</text>
<text fill="#57676f" font-size="14.5" x="110" y="188" text-anchor="middle">Reset button</text>
<path fill="none" stroke="#8a969b" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" d="M137,140 H743 V286"></path>
<text fill="#8a969b" font-size="13" x="420" y="132" text-anchor="middle">reset session</text>

<!-- INA228 -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="180" y="281" width="190" height="100" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="275" y="316" text-anchor="middle">INA228</text>
<text fill="#57676f" font-size="14.5" x="275" y="338" text-anchor="middle">current / voltage</text>
<text fill="#57676f" font-size="14.5" x="275" y="356" text-anchor="middle">sensor, I2C</text>

<!-- Sensor -->
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" d="M370,331 H400"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="400" y="281" width="190" height="100" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="495" y="318" text-anchor="middle">Ina228Sensor</text>
<text fill="#57676f" font-size="14.5" x="495" y="340" text-anchor="middle">reads &amp; converts</text>
<text fill="#57676f" font-size="14.5" x="495" y="358" text-anchor="middle">registers</text>

<!-- Hub -->
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M590,331 H630"></path>
<rect fill="#e7d3bf" stroke="#16222c" stroke-width="2.4" x="630" y="286" width="225" height="90" rx="4"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="742.5" y="316" text-anchor="middle">TelemetryStore</text>
<text fill="#57676f" font-size="14.5" x="742.5" y="338" text-anchor="middle">latest sample +</text>
<text fill="#57676f" font-size="14.5" x="742.5" y="356" text-anchor="middle">session min/max/Ah/Wh</text>

<!-- Bus -->
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M855,331 H890"></path>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,96 V566"></path>

<!-- consumers -->
<!-- OLED y=60 h=72 mid=96 -->
<circle fill="#16222c" cx="890" cy="96" r="3.6"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,96 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="60" width="270" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1065" y="94" text-anchor="middle">OledDisplay</text>
<text fill="#57676f" font-size="14.5" x="1065" y="116" text-anchor="middle">live / extrema pages</text>

<!-- BLE y=154 h=72 mid=190 -->
<circle fill="#16222c" cx="890" cy="190" r="3.6"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,190 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="154" width="270" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1065" y="188" text-anchor="middle">BleTelemetryService</text>
<text fill="#57676f" font-size="14.5" x="1065" y="210" text-anchor="middle">notify + controls</text>

<!-- WebDash y=248 h=72 mid=284 bottom=320 -->
<circle fill="#16222c" cx="890" cy="284" r="3.6"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,284 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="248" width="270" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1065" y="282" text-anchor="middle">WebDashboard</text>
<text fill="#57676f" font-size="14.5" x="1065" y="304" text-anchor="middle">REST + WebSocket</text>

<!-- MQTT y=342 h=72 mid=378 bottom=414 -->
<circle fill="#16222c" cx="890" cy="378" r="3.6"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,378 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="342" width="270" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1065" y="376" text-anchor="middle">MqttPublisher</text>
<text fill="#57676f" font-size="14.5" x="1065" y="398" text-anchor="middle">state + availability</text>

<!-- LoadProt y=436 h=72 mid=472 -->
<circle fill="#16222c" cx="890" cy="472" r="3.6"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,472 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="436" width="270" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1065" y="470" text-anchor="middle">LoadProtectionMonitor</text>
<text fill="#57676f" font-size="14.5" x="1065" y="492" text-anchor="middle">low-V / low-SoC trip</text>

<!-- Serial y=530 h=72 mid=566 -->
<circle fill="#16222c" cx="890" cy="566" r="3.6"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round" d="M890,566 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="530" width="270" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1065" y="564" text-anchor="middle">Serial diagnostics</text>
<text fill="#57676f" font-size="14.5" x="1065" y="586" text-anchor="middle">boot log + status</text>

<!-- config wires: perpendicular approach only, never flush along a box border -->
<path fill="none" stroke="#8a969b" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" d="M1065,320 V342"></path>
<text fill="#8a969b" font-size="13" x="1082" y="335">configures</text>

<path fill="none" stroke="#8a969b" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" d="M1200,284 H1220 V425 H1065 V436"></path>
<text fill="#8a969b" font-size="13" x="1228" y="280">configures</text>

<!-- outputs -->
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" d="M1200,378 H1240"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="1240" y="342" width="190" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1335" y="376" text-anchor="middle">Home Assistant</text>
<text fill="#57676f" font-size="14.5" x="1335" y="398" text-anchor="middle">MQTT discovery</text>

<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" d="M1200,472 H1240"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="1240" y="436" width="190" height="72" rx="3"></rect>
<text fill="#16222c" font-size="19" font-weight="700" x="1335" y="470" text-anchor="middle">Relay / SSR</text>
<text fill="#57676f" font-size="14.5" x="1335" y="492" text-anchor="middle">load disconnect</text>

<path fill="none" stroke="#8a969b" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" d="M1430,472 H1480"></path>
<text fill="#8a969b" font-size="13" x="1485" y="477">to load</text>

<!-- legend -->
<line x1="30" y1="630" x2="66" y2="630" stroke="#b8672e" stroke-width="2.5" stroke-linecap="round"></line>
<text fill="#57676f" font-size="14.5" x="76" y="635">telemetry data path</text>
<line x1="330" y1="630" x2="366" y2="630" stroke="#16222c" stroke-width="2"></line>
<text fill="#57676f" font-size="14.5" x="376" y="635">downstream output</text>
<line x1="610" y1="630" x2="646" y2="630" stroke="#8a969b" stroke-width="1.8" stroke-dasharray="5 5"></line>
<text fill="#57676f" font-size="14.5" x="656" y="635">configuration / control</text>
</svg>
