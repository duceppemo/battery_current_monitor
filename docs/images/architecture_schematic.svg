<svg viewBox="0 0 1580 660" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="System architecture: the INA228 feeds Ina228Sensor into the TelemetryStore hub, which fans out over a telemetry bus to OledDisplay, BleTelemetryService, WebDashboard, MqttPublisher, LoadProtectionMonitor and Serial diagnostics; two physical buttons and the Web Dashboard drive dashed configuration paths; MqttPublisher reaches Home Assistant and LoadProtectionMonitor drives the Relay/SSR">
<style>
  :root {
    --surface: #ffffff;
    --ink: #16222c;
    --ink-muted: #57676f;
    --ink-faint: #8a969b;
    --accent: #b8672e;
    --accent-soft: #e7d3bf;
    --border-strong: #b9c0bd;
  }
  text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, "Liberation Mono", monospace; }
  .bgcard { fill: var(--surface); stroke: var(--border-strong); stroke-width: 2; }
  .wire { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .wire-signal { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .wire-dashed { fill: none; stroke: var(--ink-faint); stroke-width: 1.6; stroke-dasharray: 4 4; stroke-linecap: round; }
  .outline { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
  .outline-hub { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 2.2; }
  .dot { fill: var(--ink); }
  .lbl-b { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .lbl-muted { fill: var(--ink-muted); font-size: 11px; }
  .lbl-faint { fill: var(--ink-faint); font-size: 10.5px; }
  .lbl-title { fill: var(--ink); font-size: 14.5px; font-weight: 700; letter-spacing: 0.01em; }
</style>

<rect class="bgcard" x="2" y="2" width="1576" height="656" rx="4"></rect>

<!-- buttons -->
<circle class="outline" cx="110" cy="50" r="26"></circle>
<text class="lbl-b" x="110" y="55" text-anchor="middle">D5</text>
<text class="lbl-muted" x="110" y="94" text-anchor="middle">Display button</text>
<path class="wire-dashed" d="M136,50 H1040 V90"></path>
<text class="lbl-faint" x="600" y="42" text-anchor="middle">on/off, page</text>

<circle class="outline" cx="110" cy="150" r="26"></circle>
<text class="lbl-b" x="110" y="155" text-anchor="middle">D4</text>
<text class="lbl-muted" x="110" y="194" text-anchor="middle">Reset button</text>
<path class="wire-dashed" d="M136,150 H755 V210"></path>
<text class="lbl-faint" x="420" y="142" text-anchor="middle">reset session</text>

<!-- INA228 -->
<rect class="outline" x="200" y="260" width="150" height="90" rx="3"></rect>
<text class="lbl-title" x="275" y="298" text-anchor="middle">INA228</text>
<text class="lbl-muted" x="275" y="316" text-anchor="middle">current / voltage</text>
<text class="lbl-muted" x="275" y="331" text-anchor="middle">sensor, I2C</text>

<!-- Sensor -->
<path class="wire" d="M350,305 H430"></path>
<rect class="outline" x="430" y="260" width="150" height="90" rx="3"></rect>
<text class="lbl-title" x="505" y="300" text-anchor="middle">Ina228Sensor</text>
<text class="lbl-muted" x="505" y="318" text-anchor="middle">reads &amp; converts</text>
<text class="lbl-muted" x="505" y="333" text-anchor="middle">registers</text>

<!-- Hub -->
<path class="wire-signal" d="M580,305 H660"></path>
<rect class="outline-hub" x="660" y="210" width="190" height="190" rx="4"></rect>
<text class="lbl-title" x="755" y="298" text-anchor="middle">TelemetryStore</text>
<text class="lbl-muted" x="755" y="318" text-anchor="middle">latest sample +</text>
<text class="lbl-muted" x="755" y="333" text-anchor="middle">session min/max/Ah/Wh</text>

<!-- Bus -->
<path class="wire-signal" d="M850,305 H890"></path>
<path class="wire-signal" d="M890,125 V565"></path>

<!-- consumers -->
<circle class="dot" cx="890" cy="125" r="3.2"></circle>
<path class="wire-signal" d="M890,125 H930"></path>
<rect class="outline" x="930" y="90" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1040" y="120" text-anchor="middle">OledDisplay</text>
<text class="lbl-muted" x="1040" y="138" text-anchor="middle">live / extrema pages</text>

<circle class="dot" cx="890" cy="213" r="3.2"></circle>
<path class="wire-signal" d="M890,213 H930"></path>
<rect class="outline" x="930" y="178" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1040" y="208" text-anchor="middle">BleTelemetryService</text>
<text class="lbl-muted" x="1040" y="226" text-anchor="middle">notify + controls</text>

<circle class="dot" cx="890" cy="301" r="3.2"></circle>
<path class="wire-signal" d="M890,301 H930"></path>
<rect class="outline" x="930" y="266" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1040" y="296" text-anchor="middle">WebDashboard</text>
<text class="lbl-muted" x="1040" y="314" text-anchor="middle">REST + WebSocket</text>

<circle class="dot" cx="890" cy="389" r="3.2"></circle>
<path class="wire-signal" d="M890,389 H930"></path>
<rect class="outline" x="930" y="354" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1040" y="384" text-anchor="middle">MqttPublisher</text>
<text class="lbl-muted" x="1040" y="402" text-anchor="middle">state + availability</text>

<circle class="dot" cx="890" cy="477" r="3.2"></circle>
<path class="wire-signal" d="M890,477 H930"></path>
<rect class="outline" x="930" y="442" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1040" y="470" text-anchor="middle">LoadProtectionMonitor</text>
<text class="lbl-muted" x="1040" y="488" text-anchor="middle">low-V / low-SoC trip</text>

<circle class="dot" cx="890" cy="565" r="3.2"></circle>
<path class="wire-signal" d="M890,565 H930"></path>
<rect class="outline" x="930" y="530" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1040" y="560" text-anchor="middle">Serial diagnostics</text>
<text class="lbl-muted" x="1040" y="578" text-anchor="middle">boot log + status</text>

<!-- config wires -->
<path class="wire-dashed" d="M1040,336 V354"></path>
<text class="lbl-faint" x="1058" y="348">configures</text>

<path class="wire-dashed" d="M1150,301 H1170 V442 H1040"></path>
<text class="lbl-faint" x="1178" y="298">configures</text>

<!-- outputs -->
<path class="wire" d="M1150,389 H1190"></path>
<rect class="outline" x="1190" y="354" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1300" y="384" text-anchor="middle">Home Assistant</text>
<text class="lbl-muted" x="1300" y="402" text-anchor="middle">MQTT discovery</text>

<path class="wire" d="M1150,477 H1190"></path>
<rect class="outline" x="1190" y="442" width="220" height="70" rx="3"></rect>
<text class="lbl-title" x="1300" y="470" text-anchor="middle">Relay / SSR</text>
<text class="lbl-muted" x="1300" y="488" text-anchor="middle">load disconnect</text>

<path class="wire-dashed" d="M1410,477 H1460"></path>
<text class="lbl-faint" x="1465" y="481">to load</text>

<!-- legend -->
<line x1="30" y1="610" x2="58" y2="610" class="wire-signal"></line>
<text class="lbl-muted" x="66" y="614">telemetry data path</text>
<line x1="260" y1="610" x2="288" y2="610" class="wire"></line>
<text class="lbl-muted" x="296" y="614">downstream output</text>
<line x1="490" y1="610" x2="518" y2="610" class="wire-dashed"></line>
<text class="lbl-muted" x="526" y="614">configuration / control</text>
</svg>
