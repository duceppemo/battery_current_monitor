<svg viewBox="0 0 1580 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, 'Liberation Mono', monospace"
  aria-label="System architecture: the INA228 feeds Ina228Sensor into the TelemetryStore hub, which fans out over a telemetry bus to OledDisplay, BleTelemetryService, WebDashboard, MqttPublisher, LoadProtectionMonitor and Serial diagnostics; two physical buttons and the Web Dashboard drive dashed configuration paths; MqttPublisher reaches Home Assistant and LoadProtectionMonitor drives the Relay/SSR">

<rect fill="#ffffff" stroke="#b9c0bd" stroke-width="2" x="2" y="2" width="1576" height="656" rx="4"></rect>

<!-- buttons -->
<circle fill="#ffffff" stroke="#16222c" stroke-width="1.6" cx="110" cy="50" r="26"></circle>
<text fill="#16222c" font-size="13" font-weight="700" x="110" y="55" text-anchor="middle">D5</text>
<text fill="#57676f" font-size="11" x="110" y="94" text-anchor="middle">Display button</text>
<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M136,50 H1040 V90"></path>
<text fill="#8a969b" font-size="10.5" x="600" y="42" text-anchor="middle">on/off, page</text>

<circle fill="#ffffff" stroke="#16222c" stroke-width="1.6" cx="110" cy="150" r="26"></circle>
<text fill="#16222c" font-size="13" font-weight="700" x="110" y="155" text-anchor="middle">D4</text>
<text fill="#57676f" font-size="11" x="110" y="194" text-anchor="middle">Reset button</text>
<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M136,150 H755 V210"></path>
<text fill="#8a969b" font-size="10.5" x="420" y="142" text-anchor="middle">reset session</text>

<!-- INA228 -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="200" y="260" width="150" height="90" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="275" y="298" text-anchor="middle">INA228</text>
<text fill="#57676f" font-size="11" x="275" y="316" text-anchor="middle">current / voltage</text>
<text fill="#57676f" font-size="11" x="275" y="331" text-anchor="middle">sensor, I2C</text>

<!-- Sensor -->
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M350,305 H430"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="430" y="260" width="150" height="90" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="505" y="300" text-anchor="middle">Ina228Sensor</text>
<text fill="#57676f" font-size="11" x="505" y="318" text-anchor="middle">reads &amp; converts</text>
<text fill="#57676f" font-size="11" x="505" y="333" text-anchor="middle">registers</text>

<!-- Hub -->
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M580,305 H660"></path>
<rect fill="#e7d3bf" stroke="#16222c" stroke-width="2.2" x="660" y="210" width="190" height="190" rx="4"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="755" y="298" text-anchor="middle">TelemetryStore</text>
<text fill="#57676f" font-size="11" x="755" y="318" text-anchor="middle">latest sample +</text>
<text fill="#57676f" font-size="11" x="755" y="333" text-anchor="middle">session min/max/Ah/Wh</text>

<!-- Bus -->
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M850,305 H890"></path>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,125 V565"></path>

<!-- consumers -->
<circle fill="#16222c" cx="890" cy="125" r="3.2"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,125 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="90" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1040" y="120" text-anchor="middle">OledDisplay</text>
<text fill="#57676f" font-size="11" x="1040" y="138" text-anchor="middle">live / extrema pages</text>

<circle fill="#16222c" cx="890" cy="213" r="3.2"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,213 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="178" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1040" y="208" text-anchor="middle">BleTelemetryService</text>
<text fill="#57676f" font-size="11" x="1040" y="226" text-anchor="middle">notify + controls</text>

<circle fill="#16222c" cx="890" cy="301" r="3.2"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,301 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="266" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1040" y="296" text-anchor="middle">WebDashboard</text>
<text fill="#57676f" font-size="11" x="1040" y="314" text-anchor="middle">REST + WebSocket</text>

<circle fill="#16222c" cx="890" cy="389" r="3.2"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,389 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="354" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1040" y="384" text-anchor="middle">MqttPublisher</text>
<text fill="#57676f" font-size="11" x="1040" y="402" text-anchor="middle">state + availability</text>

<circle fill="#16222c" cx="890" cy="477" r="3.2"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,477 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="442" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1040" y="470" text-anchor="middle">LoadProtectionMonitor</text>
<text fill="#57676f" font-size="11" x="1040" y="488" text-anchor="middle">low-V / low-SoC trip</text>

<circle fill="#16222c" cx="890" cy="565" r="3.2"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M890,565 H930"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="930" y="530" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1040" y="560" text-anchor="middle">Serial diagnostics</text>
<text fill="#57676f" font-size="11" x="1040" y="578" text-anchor="middle">boot log + status</text>

<!-- config wires -->
<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M1040,336 V354"></path>
<text fill="#8a969b" font-size="10.5" x="1058" y="348">configures</text>

<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M1150,301 H1170 V442 H1040"></path>
<text fill="#8a969b" font-size="10.5" x="1178" y="298">configures</text>

<!-- outputs -->
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1150,389 H1190"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="1190" y="354" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1300" y="384" text-anchor="middle">Home Assistant</text>
<text fill="#57676f" font-size="11" x="1300" y="402" text-anchor="middle">MQTT discovery</text>

<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1150,477 H1190"></path>
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="1190" y="442" width="220" height="70" rx="3"></rect>
<text fill="#16222c" font-size="14.5" font-weight="700" letter-spacing="0.01em" x="1300" y="470" text-anchor="middle">Relay / SSR</text>
<text fill="#57676f" font-size="11" x="1300" y="488" text-anchor="middle">load disconnect</text>

<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M1410,477 H1460"></path>
<text fill="#8a969b" font-size="10.5" x="1465" y="481">to load</text>

<!-- legend -->
<line x1="30" y1="610" x2="58" y2="610" fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"></line>
<text fill="#57676f" font-size="11" x="66" y="614">telemetry data path</text>
<line x1="260" y1="610" x2="288" y2="610" fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></line>
<text fill="#57676f" font-size="11" x="296" y="614">downstream output</text>
<line x1="490" y1="610" x2="518" y2="610" fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"></line>
<text fill="#57676f" font-size="11" x="526" y="614">configuration / control</text>
</svg>
