<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, 'Liberation Mono', monospace"
  aria-label="Schematic: GPIO5 through a 1k base resistor to a PN2222 transistor base, transistor emitter to common ground through a 10k pulldown, collector to the SSR control minus terminal, an external 5 to 12 volt supply feeding the SSR control plus terminal and common ground">

<rect fill="#ffffff" stroke="#b9c0bd" stroke-width="2" x="2" y="2" width="916" height="466" rx="4"></rect>

<!-- ESP32 module -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="20" y="110" width="160" height="110" rx="3"></rect>
<text fill="#16222c" font-size="15" font-weight="700" letter-spacing="0.02em" x="100" y="158" text-anchor="middle">XIAO</text>
<text fill="#16222c" font-size="15" font-weight="700" letter-spacing="0.02em" x="100" y="176" text-anchor="middle">ESP32-C3</text>
<text fill="#57676f" font-size="11" x="100" y="196" text-anchor="middle">GPIO5 / D3 &#183; GND</text>

<!-- GPIO5 signal path -->
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M180,150 H230"></path>
<text fill="#b8672e" font-size="11" font-weight="600" x="184" y="138">GPIO5 HIGH = SSR ON</text>

<!-- R1 -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="230" y="142" width="50" height="16"></rect>
<text fill="#16222c" font-size="13" font-weight="700" x="255" y="130" text-anchor="middle">R1</text>
<text fill="#57676f" font-size="11" x="255" y="168" text-anchor="middle">1 k&#8486;</text>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M280,150 H330"></path>

<!-- Node A -->
<circle fill="#16222c" cx="330" cy="150" r="3.2"></circle>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M330,150 V190"></path>

<!-- R2 pulldown -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="322" y="190" width="16" height="50"></rect>
<text fill="#16222c" font-size="13" font-weight="700" x="346" y="209" text-anchor="start">R2</text>
<text fill="#57676f" font-size="11" x="346" y="225" text-anchor="start">10 k&#8486;</text>
<text fill="#57676f" font-size="11" x="346" y="240" text-anchor="start">pulldown</text>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M330,240 V400"></path>
<circle fill="#16222c" cx="330" cy="400" r="3.2"></circle>

<!-- Base wire into transistor -->
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M330,150 H364"></path>

<!-- Q1 transistor -->
<circle fill="#f8f9f8" stroke="#b9c0bd" stroke-width="1.4" cx="400" cy="150" r="36"></circle>
<path fill="none" stroke="#b8672e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M364,150 H388"></path>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M388,132 V168"></path>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M388,136 L412,122"></path>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M412,122 V70"></path>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M412,70 H520"></path>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M388,164 L412,178"></path>
<polygon fill="#16222c" points="412,178 400,174 405,184"></polygon>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M412,178 V400"></path>
<circle fill="#16222c" cx="412" cy="400" r="3.2"></circle>

<text fill="#16222c" font-size="13" font-weight="700" x="400" y="106" text-anchor="middle">Q1 &#183; PN2222</text>
<text fill="#16222c" font-size="13" x="368" y="142" text-anchor="end">B</text>
<text fill="#16222c" font-size="13" x="420" y="112" text-anchor="start">C</text>
<text fill="#16222c" font-size="13" x="420" y="196" text-anchor="start">E</text>

<!-- SSR module -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="520" y="40" width="200" height="140" rx="3"></rect>
<text fill="#16222c" font-size="15" font-weight="700" letter-spacing="0.02em" x="620" y="88" text-anchor="middle">DC-DC SSR</text>
<text fill="#57676f" font-size="11" x="620" y="106" text-anchor="middle">control input, 3&#8211;32 V DC</text>
<text fill="#57676f" font-size="11" x="620" y="150" text-anchor="middle">exact part TBD</text>
<text fill="#16222c" font-size="13" font-weight="700" x="512" y="66" text-anchor="end">IN&#8722;</text>
<text fill="#16222c" font-size="13" font-weight="700" x="512" y="114" text-anchor="end">IN+</text>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M520,110 H480"></path>

<!-- Load side, out of scope -->
<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M720,70 H780"></path>
<path fill="none" stroke="#8a969b" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" d="M720,110 H780"></path>
<text fill="#57676f" font-size="11" x="788" y="74">to load</text>
<text fill="#57676f" font-size="11" x="788" y="90">(not shown &#8212;</text>
<text fill="#57676f" font-size="11" x="788" y="106">check ratings</text>
<text fill="#57676f" font-size="11" x="788" y="122">&amp; fusing)</text>

<!-- DC supply -->
<rect fill="#ffffff" stroke="#16222c" stroke-width="1.6" x="400" y="260" width="160" height="70" rx="3"></rect>
<text fill="#16222c" font-size="15" font-weight="700" letter-spacing="0.02em" x="480" y="292" text-anchor="middle">DC SUPPLY</text>
<text fill="#57676f" font-size="11" x="480" y="310" text-anchor="middle">5&#8211;12 V, control side only</text>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M480,260 V110"></path>
<text fill="#16222c" font-size="13" x="466" y="264" text-anchor="end">+</text>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M480,330 V400"></path>
<circle fill="#16222c" cx="480" cy="400" r="3.2"></circle>
<text fill="#16222c" font-size="13" x="466" y="326" text-anchor="end">&#8722;</text>

<!-- ESP32 GND drop -->
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M60,220 V400"></path>
<circle fill="#16222c" cx="60" cy="400" r="3.2"></circle>

<!-- Ground bus -->
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M60,400 H480"></path>
<path fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M200,400 V416"></path>
<line fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="184" y1="416" x2="216" y2="416"></line>
<line fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="190" y1="421" x2="210" y2="421"></line>
<line fill="none" stroke="#16222c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="196" y1="426" x2="204" y2="426"></line>
<text fill="#57676f" font-size="11" x="200" y="442" text-anchor="middle">COMMON GROUND</text>
</svg>
