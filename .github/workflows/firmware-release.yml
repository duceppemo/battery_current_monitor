name: Publish firmware release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio ecdsa
      - name: Verify release tag matches firmware version
        run: |
          version="${GITHUB_REF_NAME#v}"
          embedded_version="$(sed -n 's/^#define BATTERY_MONITOR_FIRMWARE_VERSION "\([^"]*\)"/\1/p' include/AppConfig.h)"
          test -n "$embedded_version"
          test "$version" = "$embedded_version"
      - name: Build OTA and factory images
        run: pio run
      - name: Sign firmware image
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          key_file="$(mktemp)"
          printf '%s' "$FIRMWARE_SIGNING_KEY" > "$key_file"
          python - "$key_file" .pio/build/xiao_esp32c3/firmware.bin firmware.sig <<'PY'
          import hashlib
          import sys

          from ecdsa import SigningKey
          from ecdsa.util import sigencode_string

          key_path, image_path, sig_path = sys.argv[1:4]
          with open(key_path, "rb") as key_fh:
              signing_key = SigningKey.from_pem(key_fh.read())
          with open(image_path, "rb") as image_fh:
              digest = hashlib.sha256(image_fh.read()).digest()
          # Raw r||s (64 bytes), not ASN.1 DER -- matches the fixed-length
          # parsing FirmwareUpdateService::verifySignature() does on-device.
          signature = signing_key.sign_digest(digest, sigencode=sigencode_string)
          assert len(signature) == 64
          with open(sig_path, "wb") as sig_fh:
              sig_fh.write(signature)
          PY
          shred -u "$key_file"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp .pio/build/xiao_esp32c3/firmware.bin "release/battery-monitor-${version}.bin"
          cp firmware.sig "release/battery-monitor-${version}.sig"
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32c3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o "release/battery-monitor-${version}.factory.bin" \
            0x0 .pio/build/xiao_esp32c3/bootloader.bin \
            0x8000 .pio/build/xiao_esp32c3/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/xiao_esp32c3/firmware.bin
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes
