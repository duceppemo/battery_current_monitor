name: Publish firmware release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Verify release tag matches firmware version
        run: |
          version="${GITHUB_REF_NAME#v}"
          embedded_version="$(sed -n 's/^#define BATTERY_MONITOR_FIRMWARE_VERSION "\([^"]*\)"/\1/p' include/AppConfig.h)"
          test -n "$embedded_version"
          test "$version" = "$embedded_version"
      - name: Build OTA and factory images
        run: pio run
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp .pio/build/xiao_esp32c3/firmware.bin "release/battery-monitor-${version}.bin"
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32c3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o "release/battery-monitor-${version}.factory.bin" \
            0x0 .pio/build/xiao_esp32c3/bootloader.bin \
            0x8000 .pio/build/xiao_esp32c3/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/xiao_esp32c3/firmware.bin
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes
