[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

lib_deps =
    olikraus/U8g2

build_flags =
    -Wall
    -Wextra

monitor_port = COM7
# Keep monitor open/close from toggling USB serial control lines, which can
# reset or disrupt the ESP32-C3 USB interface during a radio test.
monitor_dtr = 0
monitor_rts = 0
