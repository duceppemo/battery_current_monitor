[env:xiao_esp32c3]
platform = espressif32@7.0.1
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

lib_deps =
    olikraus/U8g2
    links2004/WebSockets
    knolleary/PubSubClient

build_flags =
    -Wall
    -Wextra
    ; Home Assistant MQTT discovery payloads (JSON with a device block) run
    ; well past PubSubClient's 256-byte default.
    -D MQTT_MAX_PACKET_SIZE=1024

monitor_port = COM7
# Keep monitor open/close from toggling USB serial control lines, which can
# reset or disrupt the ESP32-C3 USB interface during a radio test.
monitor_dtr = 0
monitor_rts = 0
